# .streamlit/secrets.toml
# Place this file at .streamlit/secrets.toml in your repo
# DO NOT commit this file to GitHub — add it to .gitignore

# 1. Go to https://github.com/settings/tokens/new
# 2. Give it a name, set expiry, check "repo" scope
# 3. Copy the token below

GITHUB_TOKEN = "ghp_your_token_here"
GITHUB_REPO  = "youruser/yourrepo"       # e.g. "chuchuls/futures-etftrend"
GITHUB_PATH  = "historicalDataBBG.xlsx"  # path inside repo, e.g. "data/historicalDataBBG.xlsx"
